# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → select this repo. See docs/deploy.md.
#
# - Database: Neon free Postgres (Render's free Postgres expires after 30 days; judging runs to Dec 15).
# - Scheduling: the hourly agent run is a GitHub Actions workflow (.github/workflows/agent-cron.yml),
#   not a Render cron job.

services:
  - type: web
    name: settle
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:render
    # Migrations run on every deploy before the server starts (works on the free plan).
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Neon *direct* (non-pooled) connection string, with ?sslmode=require
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false # set after registering the webhook (docs/deploy.md)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: APP_BASE_URL
        sync: false # https://<your-service>.onrender.com
      - key: CRON_SECRET
        sync: false # same value as the CRON_SECRET GitHub Actions secret
      - key: DEMO_MODE
        value: "true" # judging instance: sandbox routing, demo clock, Reset demo
      - key: SANDBOX_BUYER_EMAIL
        sync: false
      - key: SANDBOX_SUB1_EMAIL
        sync: false
      - key: SANDBOX_SUB2_EMAIL
        sync: false
